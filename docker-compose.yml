version: "3.9"

services:
  ash-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ash-api
    ports:
      - "8000:8000"
    volumes:
      - ./.project_ash:/app/.project_ash
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
