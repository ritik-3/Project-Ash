<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ash Control Surface</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <div class="app-container">
      
      <!-- Top Header -->
      <header class="app-header">
        <div class="brand">
          <span class="brand-text">ASH</span>
          <span class="brand-glow"></span>
        </div>
        <div class="header-status">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText" class="status-text">Ready</span>
        </div>
      </header>

      <main class="app-main">
        <!-- LEFT COLUMN: The Persona & Controls -->
        <section class="left-column">
          
          <!-- The Orb -->
          <div class="orb-container">
            <canvas id="orbCanvas" class="orb"></canvas>
            
            <!-- Mic Energy Meter under Orb -->
            <div class="mic-meter-container">
              <div class="meter">
                <div id="meterFill" class="meter-fill"></div>
              </div>
            </div>
          </div>

          <!-- Segmented Control for Modes -->
          <div class="segmented-control-container">
            <div class="segmented-control">
              <button class="segment active" data-mode="DIRECT_VOICE" aria-label="Direct Voice">
                <span class="segment-icon">⚡</span>
                <span class="segment-label">Direct</span>
              </button>
              <button class="segment" data-mode="AUTO_CONTINUOUS" aria-label="Conversation">
                <span class="segment-icon">💬</span>
                <span class="segment-label">Auto</span>
              </button>
              <button class="segment" data-mode="WAKE_WORD_TRIGGERED" aria-label="Wake Mode">
                <span class="segment-icon">🎙️</span>
                <span class="segment-label">Wake</span>
              </button>
              <button class="segment" data-mode="SPACEBAR_HOLD" aria-label="Push-to-Talk">
                <span class="segment-icon">⌨️</span>
                <span class="segment-label">PTT</span>
              </button>
            </div>
          </div>

          <!-- Status Indicator Info & Toggles -->
          <div class="bottom-controls-row">
            <div id="modeStatusInfo" class="mode-status-info">
              <div id="statusIndicator" class="status-indicator idle">
                <div class="status-indicator-pulse"></div>
              </div>
              <span id="statusIndicatorText" class="status-indicator-text">Idle</span>
            </div>

            <button id="micButton" class="btn-icon-toggle" aria-label="Toggle Mic Visualizer" title="Enable Mic Visualizer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="20" x2="12" y2="10"></line>
                <line x1="18" y1="20" x2="18" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="16"></line>
              </svg>
            </button>
          </div>
        </section>

        <!-- RIGHT COLUMN: The Context / Chat -->
        <section class="right-column">
          <!-- Chat Log Area -->
          <div class="chat-container">
            <div id="chatLog" class="chat-log" aria-live="polite" aria-label="Chat messages"></div>
          </div>
          
          <!-- Docked Input Area -->
          <div class="input-dock">
            <button id="dockMicBtn" class="btn-dock-mic" aria-label="Trigger Voice" title="Trigger Voice">
              <span class="mic-icon">🎤</span>
            </button>
            <input
              id="textInput"
              type="text"
              class="chat-input"
              placeholder="Type to Ash or click mic..."
              maxlength="500"
              aria-label="Message input"
            />
            <button id="sendButton" class="btn-dock-send" aria-label="Send message">
              <span class="send-icon">→</span>
            </button>
          </div>
        </section>
      </main>

    </div>

    <!-- Hidden legacy element for backward compatibility with app.js if needed, or removed if app.js is updated -->
    <label class="wake-toggle hidden">
      <input id="wakeToggle" type="checkbox" checked />
    </label>
    <script src="/web/orb.js" defer></script>
    <script src="/web/app.js" defer></script>
  </body>
</html>
