[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ash"
version = "0.1.0"
description = "Local-first desktop AI assistant MVP foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "SpeechRecognition>=3.10.4",
  "pyttsx3>=2.90"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]
local-ai = [
  "faster-whisper>=1.0.3",
  "openwakeword>=0.6.0"
]
automation = [
  "playwright>=1.52.0",
  "pywinauto>=0.6.9",
  "mss>=10.1.0",
  "easyocr>=1.7.2"
]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
project-ash = "project_ash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
